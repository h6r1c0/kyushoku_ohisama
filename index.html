<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8fbd63">
<title>給食メイン量計算</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--text:#3c4035;--muted:#6f7568;--line:#d8e4ca;--green:#86b95d;--green-dark:#527c38;--green-soft:#eef6e6;--orange:#f39a45;--orange-dark:#a94f17;--orange-soft:#fff0df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-rounded,"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Yu Gothic","Meiryo",sans-serif;letter-spacing:.01em}
.wrap{max-width:760px;margin:auto;padding:14px}.app-header{overflow:hidden;background:#fff;border:1px solid var(--line);border-top:6px solid var(--green);border-radius:20px;padding:9px 12px 11px;margin-bottom:12px;box-shadow:0 3px 12px rgba(94,126,61,.08)}
.brand-logo{width:100%;max-width:380px;aspect-ratio:4.5/1;margin:0 auto;overflow:hidden;border-radius:10px;background:#fff}.brand-logo img{display:block;width:100%;height:auto;transform:translateY(-29.2%)}.app-title{margin-top:7px;padding-top:7px;border-top:2px dotted #dce8cf;font-size:21px;font-weight:900;color:#45493e;text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 2px 9px rgba(94,126,61,.06)}
.grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
strong{color:var(--green-dark)}label{font-size:13px;color:var(--muted)}input,select{width:100%;margin-top:5px;padding:11px 9px;border:1px solid #cbd9bd;border-radius:11px;background:#fff;color:var(--text);font:inherit;font-size:18px}input:focus,select:focus{outline:3px solid var(--orange-soft);border-color:var(--orange)}
.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:800;font-family:inherit}.primary{background:var(--orange);color:#4b2d17}.secondary{background:var(--green-soft);color:var(--green-dark)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.small{font-size:12px;color:var(--muted);line-height:1.5}.hidden{display:none}
.inline-option{margin:10px auto 0;max-width:420px}.inline-option select{font-size:16px;padding:8px 10px}
.food-heading{display:flex;align-items:flex-end;gap:8px}.food-heading label{flex:1}.category-chip{display:flex;align-items:center;justify-content:center;gap:4px;min-width:66px;height:44px;margin-bottom:0;border-radius:12px;background:var(--green-soft);color:var(--green-dark);font-size:13px;font-weight:900}.category-chip.hidden{display:none}.category-chip[data-category="fish"]{background:#e9f5f4;color:#327b78}.category-chip[data-category="tofu"]{background:var(--orange-soft);color:var(--orange-dark)}.category-icon{font-size:21px;line-height:1}.category-chip[data-category="tofu"] .category-icon{position:relative;display:block;width:24px;height:19px;border:2px solid currentColor;border-radius:4px;background:#fff;box-shadow:3px -3px 0 -1px #fff,3px -3px 0 1px currentColor;font-size:0}
.result{text-align:center;padding:18px 4px}.total{font-size:14px;color:var(--muted)}.big{font-size:46px;font-weight:900;line-height:1.08;margin-top:5px;color:var(--green-dark)}.sub{font-size:16px;color:#59636d;margin-top:8px;min-height:22px}.basis{font-size:14px;color:#444;border-top:1px solid #e1e8d9;margin-top:12px;padding-top:10px;line-height:1.55}
.editor-row{border-top:1px solid #e1e8d9;padding-top:12px;margin-top:12px}.box{border:1px solid var(--line);border-radius:13px;padding:10px;margin-top:8px;background:#fffefb}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:560px){.grid8,.grid5{grid-template-columns:repeat(2,1fr)}.grid3,.grid2{grid-template-columns:1fr}.big{font-size:42px}}
@media(max-width:370px){.app-header{padding-left:9px;padding-right:9px}.app-title{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
<header class="app-header">
  <div class="brand-logo">
    <img src="ohisama_pamphlet.jpg" alt="さくらさくらんぼ保育 NPO法人 おひさま保育園 企業主導型保育">
  </div>
  <div class="app-title">給食メイン量計算</div>
</header>

<div class="card">
  <div class="section-head">
    <div><strong>今日の人数</strong><div class="small">最初は基本人数が入っています。必要なところだけ直して使えます。</div></div>
    <button class="btn secondary" onclick="resetCurrentCounts()">基本人数に戻す</button>
  </div>
  <div class="grid8" style="margin-top:10px">
    <label>0歳<select id="c0"></select></label>
    <label>1歳<select id="c1"></select></label>
    <label>2歳<select id="c2"></select></label>
    <label>3歳<select id="c3"></select></label>
    <label>4歳<select id="c4"></select></label>
    <label>5歳<select id="c5"></select></label>
    <label>学童<select id="cg"></select></label>
    <label>大人<select id="ca"></select></label>
  </div>
</div>

<div class="card">
  <div class="food-heading">
    <div id="foodCategory" class="category-chip hidden" data-category=""><span id="foodCategoryIcon" class="category-icon"></span><span id="foodCategoryLabel"></span></div>
    <label>メイン食材<select id="food"></select></label>
  </div>

  <div id="foodOptionWrap" class="inline-option hidden">
    <label id="foodOptionLabel">サイズ</label>
    <select id="foodOption"></select>
  </div>

  <div id="gakudoWrap" class="inline-option hidden">
    <label>学童の1人量</label>
    <select id="gakudoRate"></select>
  </div>

  <div class="result">
    <div id="total" class="total"></div>
    <div id="mainResult" class="big">—</div>
    <div id="subResult" class="sub"></div>
    <div id="basis" class="basis"></div>
  </div>
</div>

<div class="card">
  <div class="section-head">
    <div><strong>基本人数の設定</strong><div class="small">年度替わり・保育体制変更のときだけ変更。</div></div>
    <button class="btn secondary" onclick="toggle('defaultsEditor')">開く / 閉じる</button>
  </div>
  <div id="defaultsEditor" class="hidden editor-row">
    <div class="grid8">
      <label>0歳<input id="d0" type="number" min="0"></label>
      <label>1歳<input id="d1" type="number" min="0"></label>
      <label>2歳<input id="d2" type="number" min="0"></label>
      <label>3歳<input id="d3" type="number" min="0"></label>
      <label>4歳<input id="d4" type="number" min="0"></label>
      <label>5歳<input id="d5" type="number" min="0"></label>
      <label>学童<input id="dg" type="number" min="0"></label>
      <label>大人<input id="da" type="number" min="0"></label>
    </div>
    <div class="actions"><button class="btn primary" onclick="saveDefaultCounts()">基本人数を保存</button></div>

    <div class="box">
      <strong>最大人数の設定</strong>
      <div class="small">今日の人数で選べる数字の上限です。</div>
      <div class="grid8" style="margin-top:8px">
        <label>0歳<input id="m0" type="number" min="0" step="1"></label>
        <label>1歳<input id="m1" type="number" min="0" step="1"></label>
        <label>2歳<input id="m2" type="number" min="0" step="1"></label>
        <label>3歳<input id="m3" type="number" min="0" step="1"></label>
        <label>4歳<input id="m4" type="number" min="0" step="1"></label>
        <label>5歳<input id="m5" type="number" min="0" step="1"></label>
        <label>学童<input id="mg" type="number" min="0" step="1"></label>
        <label>大人<input id="ma" type="number" min="0" step="1"></label>
      </div>
      <div class="actions"><button class="btn primary" onclick="saveMaxCounts()">最大人数を保存</button></div>
    </div>
  </div>
</div>

<div class="card">
  <div class="section-head">
    <div><strong>食材・ルール編集</strong><div class="small">食材追加、1人量、サイズ違いを変更できます。</div></div>
    <button class="btn secondary" onclick="toggleFoodEditor()">開く / 閉じる</button>
  </div>

  <div id="foodEditor" class="hidden editor-row">
    <div class="grid3">
      <label>食材名<input id="editName"></label>
      <label>分類<select id="editCategory">
        <option value="">選択してください</option>
        <option value="meat">肉</option>
        <option value="fish">魚</option>
        <option value="tofu">豆腐</option>
      </select></label>
      <label>表示単位<input id="editUnit" placeholder="切れ／本／尾など"></label>
    </div>
    <div class="grid5" style="margin-top:8px">
      <label>0歳<input id="r0" type="number" step="0.01" placeholder="未確認は空欄"></label>
      <label>1〜2歳<input id="r12" type="number" step="0.01" placeholder="未確認は空欄"></label>
      <label>3〜5歳<input id="rm" type="number" step="0.01"></label>
      <label>学童<input id="rg" type="number" step="0.01" placeholder="3〜5歳か大人の値"></label>
      <label>大人<input id="ra" type="number" step="0.01"></label>
    </div>
    <div class="grid2" style="margin-top:8px">
      <label>1発注単位で取れる量<input id="packSize" type="number" step="0.01" placeholder="例：1枚=5切れなら5"></label>
      <label>発注単位<input id="packLabel" placeholder="枚／丁／パックなど"></label>
    </div>
    <label style="display:block;margin-top:8px">補足<input id="editNote"></label>

    <div class="box">
      <label style="display:flex;align-items:center;gap:8px;color:#333">
        <input id="useOptions" type="checkbox" style="width:auto;margin:0">
        サイズ・種類をその場で選べるようにする
      </label>
      <div id="optionSettings" class="hidden" style="margin-top:10px">
        <label>オプション名<input id="optionTitle" value="サイズ"></label>
        <div class="small" style="margin-top:6px">最大3つ。使わない行は空欄。</div>
        <div id="variantRows"></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" onclick="saveFood()">保存 / 更新</button>
      <button class="btn secondary" onclick="clearFoodEditor()">新規入力</button>
      <button class="btn secondary" onclick="deleteFood()">選択中を削除</button>
    </div>
  </div>
</div>

<div class="card small">
  基本人数：0歳1・1歳0・2歳5・3歳4・4歳2・5歳5・学童0・大人8。学童が1人以上のときだけ、その食材の「3〜5歳 / 大人」の1人量を数字で選べます。
  <div style="margin-top:8px;text-align:right;color:#8a9299">Ver. 0.7</div>
</div>
</div>

<script>
const DEFAULT_COUNTS={c0:1,c1:0,c2:5,c3:4,c4:2,c5:5,cg:0,ca:8};
const DEFAULT_MAX_COUNTS={c0:5,c1:3,c2:6,c3:5,c4:3,c5:6,cg:10,ca:13};
const SELECTED_FOOD_KEY="kyushokuSelectedFoodId";
const HOKKE_MIGRATION_KEY="kyushokuHokkeAddedV1";
const AJI_HIRAKI_MIGRATION_KEY="kyushokuAjiHirakiAddedV1";
const DEFAULT_FOODS=[
 {id:"chicken",name:"鶏もも",category:"meat",unit:"切れ",r0:0,r12:1,rm:2,rg:2,ra:3,packSize:5,packLabel:"枚",note:"0歳は食べない",optionTitle:"",variants:[]},
 {id:"teba",name:"手羽元",category:"meat",unit:"本",r0:null,r12:1,rm:2,rg:2,ra:2,packSize:1,packLabel:"本",note:"0歳量は未確認",optionTitle:"サイズ",variants:[
   {name:"大きめ",r0:null,r12:1,rm:2,rg:2,ra:2},{name:"小さめ",r0:null,r12:1,rm:2,rg:2,ra:3}]},
 {id:"sasami",name:"ささみ",category:"meat",unit:"切れ",r0:0.333333,r12:1,rm:2,rg:2,ra:3,packSize:2,packLabel:"本",note:"0歳3人で約1本",optionTitle:"",variants:[]},
 {id:"pork",name:"豚・生姜焼き用",category:"meat",unit:"枚",r0:null,r12:1,rm:2,rg:2,ra:3,packSize:1,packLabel:"枚",note:"0歳量は未確認",optionTitle:"",variants:[]},
 {id:"saba",name:"サバ",category:"fish",unit:"切れ",r0:null,r12:0.333333,rm:0.5,rg:0.5,ra:0.666667,packSize:1,packLabel:"切れ",note:"0歳量は未確認",optionTitle:"",variants:[]},
 {id:"hokke",name:"ホッケ",category:"fish",unit:"切れ",r0:null,r12:0.333333,rm:0.5,rg:0.5,ra:0.666667,packSize:1,packLabel:"切れ",note:"0歳量は未確認",optionTitle:"",variants:[]},
 {id:"aji_hiraki",name:"アジの開き",category:"fish",unit:"尾",r0:null,r12:0.5,rm:1,rg:1,ra:1,packSize:1,packLabel:"尾",note:"0歳量は未確認",optionTitle:"",variants:[]},
 {id:"shishamo",name:"ししゃも",category:"fish",unit:"尾",r0:null,r12:1,rm:2,rg:2,ra:3,packSize:1,packLabel:"尾",note:"0歳量は未確認",optionTitle:"サイズ",variants:[
   {name:"標準",r0:null,r12:1,rm:2,rg:2,ra:3},{name:"小さめ",r0:null,r12:1,rm:2,rg:2,ra:4}]},
 {id:"buri",name:"ブリ",category:"fish",unit:"切れ",r0:null,r12:0.5,rm:1,rg:1,ra:1,packSize:1,packLabel:"切れ",note:"1〜2歳は1/2切れかも。未確定",optionTitle:"",variants:[]},
 {id:"tofu",name:"豆腐",category:"tofu",unit:"切れ",r0:1,r12:1,rm:2,rg:2,ra:3,packSize:8,packLabel:"丁",note:"",optionTitle:"",variants:[]}
];
const FOOD_ADDITIONS=[
 {id:"hokke",migrationKey:HOKKE_MIGRATION_KEY,copyFromId:"saba",afterId:"saba"},
 {id:"aji_hiraki",migrationKey:AJI_HIRAKI_MIGRATION_KEY,afterId:"hokke"}
];
const CATEGORY_META={
 meat:{icon:"🍖",label:"肉"},
 fish:{icon:"🐟",label:"魚"},
 tofu:{icon:"",label:"豆腐"}
};
let defaults={},maxCounts={},foods=[],editingFoodId=null;

function clone(v){return JSON.parse(JSON.stringify(v))}
function num(id){return Math.max(0,Number(document.getElementById(id).value||0))}
function nullable(id){const v=document.getElementById(id).value;return v===""?null:Number(v)}
function fmt(n){const x=Number(n);if(Math.abs(x-1/3)<0.01)return"1/3";if(Math.abs(x-2/3)<0.01)return"2/3";if(Math.abs(x-.5)<.001)return"1/2";return String(Math.round(x*100)/100)}
function toggle(id){document.getElementById(id).classList.toggle("hidden")}
function stored(key){try{return JSON.parse(localStorage.getItem(key))}catch(e){return null}}

function load(){
  defaults=stored("kyushokuDefaultCounts")||clone(DEFAULT_COUNTS);
  defaults={...DEFAULT_COUNTS,...defaults};
  maxCounts=stored("kyushokuMaxCounts")||clone(DEFAULT_MAX_COUNTS);
  maxCounts={...DEFAULT_MAX_COUNTS,...maxCounts};
  const savedFoodsV6=stored("kyushokuFoodsV6"),savedFoodsV5=stored("kyushokuFoodsV5");
  foods=savedFoodsV6||savedFoodsV5||clone(DEFAULT_FOODS);
  if(!Array.isArray(foods)||!foods.length)foods=clone(DEFAULT_FOODS);
  foods=foods.map(normalizeFood);
  const addedFoods=addNewDefaultFoods();
  if(addedFoods||!Array.isArray(savedFoodsV6)||!savedFoodsV6.length)saveFoods();
}
function addNewDefaultFoods(){
  let changed=false;
  FOOD_ADDITIONS.forEach(addition=>{
    if(localStorage.getItem(addition.migrationKey)==="1")return;
    if(!foods.some(f=>f.id===addition.id)){
      const template=addition.copyFromId
        ?foods.find(f=>f.id===addition.copyFromId)||DEFAULT_FOODS.find(f=>f.id===addition.copyFromId)
        :DEFAULT_FOODS.find(f=>f.id===addition.id);
      const defaultFood=DEFAULT_FOODS.find(f=>f.id===addition.id);
      if(template&&defaultFood){
        const food={...clone(template),id:defaultFood.id,name:defaultFood.name};
        const afterIndex=foods.findIndex(f=>f.id===addition.afterId);
        foods.splice(afterIndex>=0?afterIndex+1:foods.length,0,food);
        changed=true;
      }
    }
    localStorage.setItem(addition.migrationKey,"1");
  });
  return changed;
}
function normalizeFood(f){
  const rm=f.rm!==undefined?f.rm:(f.m!==undefined?f.m:0);
  const ra=f.ra!==undefined?f.ra:(f.a!==undefined?f.a:0);
  const defaultFood=DEFAULT_FOODS.find(item=>item.id===f.id);
  return {
    ...f,
    category:f.category||defaultFood?.category||"",
    r0:f.r0!==undefined?f.r0:(f.z!==undefined?f.z:null),
    r12:f.r12!==undefined?f.r12:(f.r2!==undefined?f.r2:(f.r1!==undefined?f.r1:(f.t!==undefined?f.t:null))),
    rm,rg:f.rg!==undefined?f.rg:rm,ra,
    optionTitle:f.optionTitle||"",
    variants:Array.isArray(f.variants)?f.variants.map(v=>({
      ...v,r0:v.r0!==undefined?v.r0:(v.z!==undefined?v.z:null),
      r12:v.r12!==undefined?v.r12:(v.r2!==undefined?v.r2:(v.r1!==undefined?v.r1:(v.t!==undefined?v.t:null))),
      rm:v.rm!==undefined?v.rm:(v.m!==undefined?v.m:rm),
      rg:v.rg!==undefined?v.rg:(v.rm!==undefined?v.rm:(v.m!==undefined?v.m:rm)),
      ra:v.ra!==undefined?v.ra:(v.a!==undefined?v.a:ra)
    })):[]
  };
}
function saveFoods(){localStorage.setItem("kyushokuFoodsV6",JSON.stringify(foods))}
function saveDefaults(){localStorage.setItem("kyushokuDefaultCounts",JSON.stringify(defaults))}
function saveMaximums(){localStorage.setItem("kyushokuMaxCounts",JSON.stringify(maxCounts))}
function saveSelectedFood(){
  const id=document.getElementById("food").value;
  if(id)localStorage.setItem(SELECTED_FOOD_KEY,id);
}

function renderCurrentCountOptions(){
  Object.keys(DEFAULT_COUNTS).forEach(k=>{
    const select=document.getElementById(k),old=select.value;
    const max=Math.max(0,Math.floor(Number(maxCounts[k])||0));
    select.innerHTML="";
    for(let i=0;i<=max;i++){const option=document.createElement("option");option.value=String(i);option.textContent=String(i);select.appendChild(option)}
    const preferred=old!==""?Math.min(Number(old),max):Math.min(Number(defaults[k]||0),max);
    select.value=String(preferred);
  });
}

function fillDefaultsEditor(){
  ["c0","c1","c2","c3","c4","c5","cg","ca"].forEach(k=>document.getElementById("d"+k.slice(1)).value=defaults[k]);
}
function fillMaxEditor(){
  ["c0","c1","c2","c3","c4","c5","cg","ca"].forEach(k=>document.getElementById("m"+k.slice(1)).value=maxCounts[k]);
}
function resetCurrentCounts(){
  Object.keys(DEFAULT_COUNTS).forEach(k=>document.getElementById(k).value=defaults[k]??0);
  update();
}
function saveDefaultCounts(){
  const entered={c0:num("d0"),c1:num("d1"),c2:num("d2"),c3:num("d3"),c4:num("d4"),c5:num("d5"),cg:num("dg"),ca:num("da")};
  const over=Object.keys(entered).filter(k=>entered[k]>maxCounts[k]);
  if(over.length){alert("基本人数が最大人数を超えています。先に最大人数を変更してください。");return}
  defaults=entered;
  saveDefaults();resetCurrentCounts();alert("基本人数を保存しました");
}
function saveMaxCounts(){
  const entered={c0:Math.floor(num("m0")),c1:Math.floor(num("m1")),c2:Math.floor(num("m2")),c3:Math.floor(num("m3")),c4:Math.floor(num("m4")),c5:Math.floor(num("m5")),cg:Math.floor(num("mg")),ca:Math.floor(num("ma"))};
  const under=Object.keys(entered).filter(k=>entered[k]<defaults[k]);
  if(under.length){alert("最大人数が基本人数を下回っています。先に基本人数を変更してください。");return}
  maxCounts=entered;saveMaximums();renderCurrentCountOptions();fillMaxEditor();update();alert("最大人数を保存しました");
}
function counts(){return{c0:num("c0"),c1:num("c1"),c2:num("c2"),c3:num("c3"),c4:num("c4"),c5:num("c5"),cg:num("cg"),ca:num("ca")}}

function renderFoods(keepId){
  const s=document.getElementById("food"),old=keepId||s.value||localStorage.getItem(SELECTED_FOOD_KEY);s.innerHTML="";
  foods.forEach(f=>{const o=document.createElement("option");o.value=f.id;o.textContent=f.name;s.appendChild(o)});
  if(old&&foods.some(f=>f.id===old))s.value=old;
  saveSelectedFood();
  update();
}
function selectedFood(){return foods.find(f=>f.id===document.getElementById("food").value)||foods[0]}
function renderFoodCategory(f){
  const chip=document.getElementById("foodCategory"),meta=CATEGORY_META[f.category];
  chip.classList.toggle("hidden",!meta);
  chip.dataset.category=meta?f.category:"";
  document.getElementById("foodCategoryIcon").textContent=meta?.icon||"";
  document.getElementById("foodCategoryLabel").textContent=meta?.label||"";
}
function renderFoodOption(f){
  const w=document.getElementById("foodOptionWrap"),s=document.getElementById("foodOption");
  if(!f.variants.length){w.classList.add("hidden");s.innerHTML="";return}
  w.classList.remove("hidden");document.getElementById("foodOptionLabel").textContent=f.optionTitle||"オプション";
  const old=s.value;s.innerHTML="";f.variants.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=v.name;s.appendChild(o)});
  if(old!==""&&Number(old)<f.variants.length)s.value=old;
}
function activeRates(f){
  const idx=Number(document.getElementById("foodOption").value||0);
  return f.variants.length?(f.variants[idx]||f.variants[0]):f;
}
function renderGakudoOptions(r,count){
  const wrap=document.getElementById("gakudoWrap"),select=document.getElementById("gakudoRate");
  wrap.classList.toggle("hidden",count<1);
  if(count<1)return;
  const old=select.value;
  const rates=[r.rm,r.ra].filter(v=>v!==null&&v!==""&&Number.isFinite(Number(v))).map(Number);
  const unique=[...new Set(rates)];
  select.innerHTML="";
  unique.forEach(v=>{const o=document.createElement("option");o.value=String(v);o.textContent=String(Math.round(v*100)/100);select.appendChild(o)});
  const preferred=[old,r.rg==null?"":String(Number(r.rg)),unique.length?String(unique[0]):""].find(v=>v!==""&&unique.some(n=>String(n)===v));
  if(preferred!==undefined)select.value=preferred;
}
function update(){
  if(!foods.length)return;
  const c=counts(),f=selectedFood();renderFoodCategory(f);renderFoodOption(f);
  const r=activeRates(f),missing=[];
  renderGakudoOptions(r,c.cg);
  const rate=(key,label,count)=>{const v=r[key];if((v===null||v==="")&&count>0){missing.push(label);return 0}return Number(v||0)};
  const r0=rate("r0","0歳",c.c0),r12=rate("r12","1〜2歳",c.c1+c.c2),rm=rate("rm","3〜5歳",c.c3+c.c4+c.c5),ra=rate("ra","大人",c.ca);
  const gakudoRate=c.cg>0?Number(document.getElementById("gakudoRate").value||0):0;
  if(c.cg>0&&!document.getElementById("gakudoRate").options.length)missing.push("学童");
  const units=r0*c.c0+r12*(c.c1+c.c2)+rm*(c.c3+c.c4+c.c5)+gakudoRate*c.cg+ra*c.ca;
  const pack=Number(f.packSize||1),qty=Math.ceil(units/pack),rem=qty*pack-units;
  const people=c.c0+c.c1+c.c2+c.c3+c.c4+c.c5+c.cg+c.ca;
  document.getElementById("total").textContent=`合計 ${people}人`;
  document.getElementById("mainResult").textContent=`${qty}${f.packLabel||f.unit||""}`;
  document.getElementById("subResult").textContent=`余り ${fmt(rem)}${f.unit||""}`+(missing.length?`・＋${missing.join("・")}分`:"");
  const bits=[
    `0歳:${r.r0==null?"未確認":fmt(r.r0)}${f.unit||""}`,
    `1〜2歳:${r.r12==null?"未確認":fmt(r.r12)}${f.unit||""}`,
    `3〜5歳:${r.rm==null?"未確認":fmt(r.rm)}${f.unit||""}`,
    `学童:${c.cg>0?fmt(gakudoRate)+(f.unit||""):"－"}`,
    `大人:${r.ra==null?"未確認":fmt(r.ra)}${f.unit||""}`
  ];
  const notes=[];if(f.variants.length)notes.push(`${f.optionTitle||"オプション"}:${f.variants[Number(document.getElementById("foodOption").value||0)]?.name||f.variants[0].name}`);
  if(f.note)notes.push(f.note);
  document.getElementById("basis").textContent=bits.join(" ／ ")+(notes.length?"　※"+notes.join("　※"):"");
}

function buildVariantRows(){
  const b=document.getElementById("variantRows");b.innerHTML="";
  for(let i=0;i<3;i++){
    const d=document.createElement("div");d.className="box";d.innerHTML=`
      <strong>選択肢 ${i+1}</strong>
      <label>表示名<input id="vName${i}"></label>
      <div class="grid5" style="margin-top:8px">
        <label>0歳<input id="v0_${i}" type="number" step="0.01"></label>
        <label>1〜2歳<input id="v12_${i}" type="number" step="0.01"></label>
        <label>3〜5歳<input id="vm_${i}" type="number" step="0.01"></label>
        <label>学童<input id="vg_${i}" type="number" step="0.01"></label>
        <label>大人<input id="va_${i}" type="number" step="0.01"></label>
      </div>`;b.appendChild(d);
  }
}
function setOptionSettings(){document.getElementById("optionSettings").classList.toggle("hidden",!document.getElementById("useOptions").checked)}
function toggleFoodEditor(){toggle("foodEditor");if(!document.getElementById("foodEditor").classList.contains("hidden"))loadFoodEditor()}
function loadFoodEditor(){
  const f=selectedFood();if(!f)return;editingFoodId=f.id;
  document.getElementById("editName").value=f.name||"";document.getElementById("editCategory").value=f.category||"";document.getElementById("editUnit").value=f.unit||"";
  [["r0","r0"],["r12","r12"],["rm","rm"],["rg","rg"],["ra","ra"]].forEach(([id,k])=>document.getElementById(id).value=f[k]==null?"":f[k]);
  document.getElementById("packSize").value=f.packSize??1;document.getElementById("packLabel").value=f.packLabel||"";document.getElementById("editNote").value=f.note||"";
  document.getElementById("useOptions").checked=f.variants.length>0;document.getElementById("optionTitle").value=f.optionTitle||"サイズ";setOptionSettings();
  for(let i=0;i<3;i++){const v=f.variants[i];document.getElementById(`vName${i}`).value=v?.name||"";["0","12","m","g","a"].forEach(k=>{const key="r"+k;document.getElementById(`v${k}_${i}`).value=v&&v[key]!=null?v[key]:""})}
}
function clearFoodEditor(){
  editingFoodId=null;["editName","editCategory","editUnit","r0","r12","rm","rg","ra","packSize","packLabel","editNote"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("useOptions").checked=false;setOptionSettings();for(let i=0;i<3;i++){document.getElementById(`vName${i}`).value="";["0","12","m","g","a"].forEach(k=>document.getElementById(`v${k}_${i}`).value="")}
}
function saveFood(){
  const name=document.getElementById("editName").value.trim();if(!name){alert("食材名を入力してください");return}
  const category=document.getElementById("editCategory").value;if(!CATEGORY_META[category]){alert("分類を選択してください");return}
  const item={id:editingFoodId||"food_"+Date.now(),name,category,unit:document.getElementById("editUnit").value.trim(),r0:nullable("r0"),r12:nullable("r12"),rm:nullable("rm"),rg:nullable("rg"),ra:nullable("ra"),
    packSize:Number(document.getElementById("packSize").value||1),packLabel:document.getElementById("packLabel").value.trim(),note:document.getElementById("editNote").value.trim(),optionTitle:"",variants:[]};
  if(document.getElementById("useOptions").checked){
    item.optionTitle=document.getElementById("optionTitle").value.trim()||"サイズ";
    for(let i=0;i<3;i++){const n=document.getElementById(`vName${i}`).value.trim();if(!n)continue;item.variants.push({name:n,r0:nullable(`v0_${i}`),r12:nullable(`v12_${i}`),rm:nullable(`vm_${i}`),rg:nullable(`vg_${i}`),ra:nullable(`va_${i}`)})}
  }
  const ix=foods.findIndex(f=>f.id===item.id);if(ix>=0)foods[ix]=item;else foods.push(item);editingFoodId=item.id;saveFoods();renderFoods(item.id);alert("食材ルールを保存しました");
}
function deleteFood(){if(!editingFoodId)return;if(!confirm("この食材を削除しますか？"))return;foods=foods.filter(f=>f.id!==editingFoodId);saveFoods();editingFoodId=null;renderFoods();clearFoodEditor()}

function init(){
  load();renderCurrentCountOptions();fillDefaultsEditor();fillMaxEditor();buildVariantRows();renderFoods();
  ["c0","c1","c2","c3","c4","c5","cg","ca"].forEach(id=>document.getElementById(id).addEventListener("change",update));
  document.getElementById("food").addEventListener("change",()=>{saveSelectedFood();update();if(!document.getElementById("foodEditor").classList.contains("hidden"))loadFoodEditor()});
  document.getElementById("foodOption").addEventListener("change",update);document.getElementById("gakudoRate").addEventListener("change",update);document.getElementById("useOptions").addEventListener("change",setOptionSettings);
}
init();
</script>
